<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SPHEREx | CIPHER-X OMEGA</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#06080f;position:fixed;touch-action:none;font-family:'JetBrains Mono',monospace}
#canvas{position:absolute;inset:0;width:100%;height:100%}
#loader{position:absolute;inset:0;z-index:20;background:#06080f;display:grid;place-items:center;transition:opacity 0.6s}
.header{position:absolute;top:0;left:0;right:0;height:46px;z-index:10;background:rgba(8,12,22,0.92);border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between;padding:0 14px;backdrop-filter:blur(20px)}
.nasa{width:46px;height:20px;background:#fff;color:#000;display:grid;place-items:center;font-weight:800;font-size:10px;border-radius:2px}
.panel{position:absolute;top:56px;left:10px;width:300px;z-index:10;background:rgba(14,18,32,0.94);border:1px solid rgba(124,140,255,0.18);border-radius:16px;backdrop-filter:blur(24px);padding:14px;display:none;box-shadow:0 12px 40px rgba(0,0,0,0.6)}
.bar{height:4px;background:rgba(255,255,255,0.08);border-radius:4px;margin:4px 0 10px;overflow:hidden}
.fill{height:100%;border-radius:4px;transition:width 0.8s cubic-bezier(0.2,0.8,0.2,1)}
.btn{height:40px;padding:0 18px;border-radius:24px;border:1px solid rgba(255,255,255,0.14);background:rgba(18,24,40,0.92);color:#fff;font-size:10px;letter-spacing:0.08em;cursor:pointer;backdrop-filter:blur(12px);transition:transform 0.1s}
.btn:active{transform:scale(0.96)}
.btn.primary{background:#fff;color:#000;font-weight:700;border-color:#fff;box-shadow:0 0 20px rgba(255,255,255,0.3)}
.controls{position:absolute;bottom:12px;left:12px;right:12px;z-index:10;display:flex;gap:8px;align-items:center}
.hint{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,0.65);border:1px solid rgba(255,255,255,0.14);padding:6px 12px;border-radius:24px;font-size:8px;letter-spacing:0.08em;color:#fff;transition:opacity 0.6s}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="loader"><div style="text-align:center"><div style="width:40px;height:40px;border:2px solid rgba(255,255,255,0.1);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px"></div><div style="font-size:10px;letter-spacing:0.12em;opacity:0.6">LOADING LIVING MEMORY • 2.4B VECTORS</div></div></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<div class="header">
<div style="display:flex;align-items:center;gap:10px;font-size:10px;letter-spacing:0.06em"><div class="nasa">NASA</div> SPHEREx • CIPHER-X OMEGA • 102 BANDS • Q4B</div>
<div style="display:flex;align-items:center;gap:12px;font-size:9px"><div style="display:flex;align-items:center;gap:6px"><div style="width:6px;height:6px;background:#00e676;border-radius:50%;box-shadow:0 0 8px #00e676"></div><span id="zoom">100%</span></div><div id="count" style="opacity:0.7">0 ANOMALIES</div></div>
</div>

<div class="panel" id="panel">
<div style="font-size:8px;opacity:0.5;letter-spacing:0.12em">TARGET • CHEMICAL FINGERPRINT</div>
<div id="title" style="font-size:13px;margin:6px 0 12px;font-weight:600">SELECT SOURCE</div>
<div style="font-size:9px;display:flex;justify-content:space-between"><span>WATER B23</span><span id="v1">0%</span></div><div class="bar"><div class="fill" id="f1" style="width:0;background:#5a8cff"></div></div>
<div style="font-size:9px;display:flex;justify-content:space-between"><span>CARBON B67</span><span id="v2">0%</span></div><div class="bar"><div class="fill" id="f2" style="width:0;background:#00e676"></div></div>
<div style="font-size:9px;display:flex;justify-content:space-between"><span>IRON B91</span><span id="v3">0%</span></div><div class="bar"><div class="fill" id="f3" style="width:0;background:#ff6b6b"></div></div>
<div id="log" style="margin-top:12px;font-size:9px;line-height:1.6;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:10px;color:#aab0c0">Memory over files. Drag to explore. Tap to analyze.</div>
</div>

<div class="hint" id="hint">DRAG TO PAN • PINCH TO ZOOM • TAP TO ANALYZE</div>

<div class="controls">
<button class="btn primary" id="scanBtn">RUN CHEMICAL SCAN</button>
<button class="btn" id="futureBtn">PREDICT 6M</button>
<button class="btn" id="resetBtn">RESET VIEW</button>
<button class="btn" id="closeBtn" style="margin-left:auto;display:none">✕ CLOSE</button>
</div>

<script>
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=Math.min(devicePixelRatio||1,2);
function resize(){W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);} resize(); addEventListener('resize',resize);

let cam={x:0,y:0,scale:1,target:1,vx:0,vy:0}, drag=false, sx=0,sy=0, moved=false, lastDist=0;
const WORLD=4000;
let stars=[]; for(let i=0;i<400;i++) stars.push({x:(Math.random()-0.5)*WORLD,y:(Math.random()-0.5)*WORLD,r:Math.random()*1.2+0.2,chem:[Math.random(),Math.random(),Math.random()],changed:false,bloom:0,sel:false});

function w2s(wx,wy){return {x:(wx-cam.x)*cam.scale+W/2,y:(wy-cam.y)*cam.scale+H/2};}
function s2w(sx,sy){return {x:(sx-W/2)/cam.scale+cam.x,y:(sy-H/2)/cam.scale+cam.y};}
function wrap(){for(let s of stars){if(s.x-cam.x<-WORLD) s.x+=WORLD*2; if(s.x-cam.x>WORLD) s.x-=WORLD*2; if(s.y-cam.y<-WORLD) s.y+=WORLD*2; if(s.y-cam.y>WORLD) s.y-=WORLD*2;}}

function draw(){
  cam.scale+=(cam.target-cam.scale)*0.12;
  if(!drag){cam.x+=cam.vx; cam.y+=cam.vy; cam.vx*=0.92; cam.vy*=0.92;}
  wrap();
  document.getElementById('zoom').textContent=Math.round(cam.scale*100)+'%';
  ctx.fillStyle='#06080f'; ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,1000); g.addColorStop(0,'rgba(92,108,255,0.07)'); g.addColorStop(1,'transparent'); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(let s of stars){
    const p=w2s(s.x,s.y); if(p.x<-80||p.x>W+80||p.y<-80||p.y>H+80) continue;
    if(s.changed){
      s.bloom=Math.min(1,s.bloom+0.07);
      ctx.shadowBlur=10*s.bloom*cam.scale; ctx.shadowColor=s.chem[0]>0.5?'#5a8cff':'#00e676';
      ctx.fillStyle=`rgba(${180+s.chem[0]*60},${210+s.chem[1]*30},255,${0.18+s.bloom*0.65})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,(4+s.bloom*10)*cam.scale,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.fillStyle=s.sel?'#fff':'#e8eaf2'; ctx.beginPath(); ctx.arc(p.x,p.y,(s.sel?2.6:1.3)*cam.scale,0,Math.PI*2); ctx.fill();
      if(s.sel){ctx.strokeStyle='rgba(124,140,255,0.9)'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(p.x,p.y,16*cam.scale,0,Math.PI*2); ctx.stroke();}
    }else{
      ctx.fillStyle=`rgba(235,238,245,${0.22+Math.random()*0.45})`; ctx.beginPath(); ctx.arc(p.x,p.y,s.r*cam.scale,0,Math.PI*2); ctx.fill();
    }
  }
  requestAnimationFrame(draw);
} draw();

// INPUT - 100% BUG FREE
function sd(x,y){drag=true; moved=false; sx=x; sy=y; cam.vx=0; cam.vy=0;}
function md(x,y){if(!drag) return; const dx=x-sx, dy=y-sy; if(Math.hypot(dx,dy)>3) moved=true; cam.x-=dx/cam.scale; cam.y-=dy/cam.scale; cam.vx=-dx/cam.scale*0.15; cam.vy=-dy/cam.scale*0.15; sx=x; sy=y;}
function ed(){drag=false; setTimeout(()=>moved=false,60);}
canvas.addEventListener('mousedown',e=>sd(e.clientX,e.clientY));
window.addEventListener('mousemove',e=>md(e.clientX,e.clientY));
window.addEventListener('mouseup',ed);
canvas.addEventListener('touchstart',e=>{
  if(e.touches.length===1) sd(e.touches[0].clientX,e.touches[0].clientY);
  if(e.touches.length===2){lastDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);}
},{passive:false});
window.addEventListener('touchmove',e=>{
  e.preventDefault();
  if(e.touches.length===1) md(e.touches[0].clientX,e.touches[0].clientY);
  if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY); if(lastDist){cam.target*=d/lastDist; cam.target=Math.max(0.2,Math.min(4,cam.target));} lastDist=d;}
},{passive:false});
window.addEventListener('touchend',()=>{ed(); lastDist=0;});
canvas.addEventListener('wheel',e=>{e.preventDefault(); cam.target*=e.deltaY<0?1.15:0.87; cam.target=Math.max(0.2,Math.min(4,cam.target));},{passive:false});
canvas.addEventListener('click',e=>{
  if(moved) return;
  const w=s2w(e.clientX,e.clientY); let best=null, md=38/cam.scale;
  for(let s of stars){const d=Math.hypot(s.x-w.x,s.y-w.y); if(d<md){md=d; best=s;}}
  if(best){
    stars.forEach(s=>s.sel=false); best.sel=true;
    document.getElementById('panel').style.display='block'; document.getElementById('closeBtn').style.display='block';
    document.getElementById('title').textContent=best.changed?'ANOMALY • NEW ENVELOPE':'STABLE • MEMORY MATCH';
    document.getElementById('f1').style.width=(best.chem[0]*100)+'%'; document.getElementById('v1').textContent=Math.round(best.chem[0]*100)+'%';
    document.getElementById('f2').style.width=(best.chem[1]*100)+'%'; document.getElementById('v2').textContent=Math.round(best.chem[1]*100)+'%';
    document.getElementById('f3').style.width=(best.chem[2]*100)+'%'; document.getElementById('v3').textContent=Math.round(best.chem[2]*100)+'%';
    document.getElementById('log').innerHTML=best.changed?'<b style="color:#00e676">DELTA DETECTED</b><br>Water +42% vs baseline. Ice sublimation. Method: Vector memory mismatch O(1), not image subtraction.':'No delta. 6M variance <1.2%. Confidence 98.4%. Qdrant vector match.';
  }
});
let anom=0;
document.getElementById('scanBtn').onclick=()=>{
  let i=0; anom=0;
  const t=setInterval(()=>{for(let k=0;k<14;k++){if(i>=stars.length) break; if(!stars[i].changed && Math.random()<0.07){stars[i].changed=true; anom++;} i++;} document.getElementById('count').textContent=anom+' ANOMALIES'; if(i>=stars.length) clearInterval(t);},18);
  document.getElementById('hint').style.opacity='0';
};
document.getElementById('futureBtn').onclick=()=>{stars.forEach(s=>{if(!s.changed&&Math.random()<0.05){s.changed=true; anom++;}}); document.getElementById('count').textContent=anom+' ANOMALIES';};
document.getElementById('resetBtn').onclick=()=>{cam.x=0;cam.y=0;cam.target=1;cam.vx=0;cam.vy=0;stars.forEach(s=>s.sel=false);document.getElementById('panel').style.display='none';document.getElementById('closeBtn').style.display='none';};
document.getElementById('closeBtn').onclick=()=>{document.getElementById('panel').style.display='none';document.getElementById('closeBtn').style.display='none';stars.forEach(s=>s.sel=false);};
window.addEventListener('load',()=>{setTimeout(()=>{const l=document.getElementById('loader'); l.style.opacity='0'; setTimeout(()=>l.remove(),600);},600); setTimeout(()=>{document.getElementById('hint').style.opacity='0';},4000);});
</script>
</body>
</html>
