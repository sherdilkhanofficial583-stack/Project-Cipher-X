<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cipher-X Omega | Living Sky Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Space Grotesk',sans-serif}
body{background:#05070f;color:white;overflow:hidden}
#canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
.ui{position:relative;z-index:10;pointer-events:none}
.header{padding:20px 30px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.logo{font-weight:700;font-size:20px;letter-spacing:1px;pointer-events:auto}
.logo span{color:#7c6cff}
.live{pointer-events:auto;background:rgba(124,108,255,0.15);border:1px solid #7c6cff;padding:8px 16px;border-radius:30px;font-size:11px;display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;background:#00ff9d;border-radius:50%;box-shadow:0 0 10px #00ff9d;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:0.4}100%{opacity:1}}
.panel{position:absolute;left:20px;bottom:20px;width:90%;max-width:380px;background:rgba(15,18,35,0.88);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:20px;pointer-events:auto}
.panel h1{font-size:22px;line-height:1.2;margin-bottom:10px}
.panel h1 i{color:#7c6cff;font-style:normal}
.panel p{font-size:12px;opacity:0.7;line-height:1.6;margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.stat{background:rgba(255,255,255,0.05);padding:10px;border-radius:12px;text-align:center}
.stat b{display:block;font-size:16px;color:#00ff9d}
.stat span{font-size:9px;opacity:0.5}
.btn{width:100%;padding:14px;background:linear-gradient(90deg,#7c6cff,#5a8cff);border:none;border-radius:12px;color:white;font-weight:700;font-size:13px;cursor:pointer}
.btn2{margin-top:8px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.15)}
.detail{position:absolute;right:20px;bottom:20px;width:90%;max-width:320px;background:rgba(15,18,35,0.9);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:16px;pointer-events:auto;display:none}
.bar{height:6px;background:rgba(255,255,255,0.1);border-radius:10px;margin:6px 0 10px;overflow:hidden}
.fill{height:100%;border-radius:10px;transition:1s}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="ui">
<div class="header">
<div class="logo">CIPHER-X <span>OMEGA</span> — Living Sky Memory</div>
<div class="live"><div class="dot"></div> NASA SPHEREx IRSA API • 102 BANDS</div>
</div>
<div class="panel">
<h1>فائل نہیں، <i>یادداشت</i><br>آسمان خود بتائے گا</h1>
<p>یہ اربوں تصویریں compare نہیں کرتا۔ ہر ستارے کی 102 کیمیکل والی یادداشت۔ جہاں یادداشت بدلی، وہاں پھول کھلا۔</p>
<div class="stats">
<div class="stat"><b>2.4B</b><span>MEMORIES</span></div>
<div class="stat"><b id="c2">0</b><span>CHANGES</span></div>
<div class="stat"><b>102</b><span>BANDS</span></div>
</div>
<button class="btn" id="scanBtn">🔍 آسمان کا کیمیکل اسکین کرو</button>
<button class="btn btn2" id="futureBtn">🔮 مستقبل دکھاؤ (اگلے 6 ماہ)</button>
</div>
<div class="detail" id="detail">
<h3 id="dTitle" style="font-size:13px;color:#00ff9d"></h3>
<div style="font-size:10px;opacity:0.6;margin:6px 0">6 MONTHS AGO vs TODAY</div>
<div style="font-size:11px">💧 WATER</div><div class="bar"><div class="fill" id="b1" style="width:20%;background:#5a8cff"></div></div>
<div style="font-size:11px">🌿 CARBON</div><div class="bar"><div class="fill" id="b2" style="width:40%;background:#00ff9d"></div></div>
<div style="font-size:11px">🔥 IRON</div><div class="bar"><div class="fill" id="b3" style="width:30%;background:#ff6c7c"></div></div>
<div id="dDesc" style="margin-top:10px;font-size:11px;line-height:1.5;background:rgba(0,255,157,0.1);padding:8px;border-radius:10px"></div>
</div>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();
let stars=[];
for(let i=0;i<700;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+0.3,base:Math.random(),chem:[Math.random()*0.3,Math.random()*0.3,Math.random()*0.3],changed:false,future:false,bloom:0});
}
let scanning=false,futureMode=false;
function draw(){
  ctx.fillStyle='#05070f';ctx.fillRect(0,0,W,H);
  const g=ctx.createRadialGradient(W*0.5,H*0.5,0,W*0.5,H*0.5,900);
  g.addColorStop(0,'rgba(124,108,255,0.09)');g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    if(s.changed){
      s.bloom+= (1-s.bloom)*0.05;
      const size=4+s.bloom*18;
      ctx.shadowBlur=15*s.bloom;
      ctx.shadowColor= s.chem[0]>0.5 ? '#5a8cff' : s.chem[1]>0.5 ? '#00ff9d' : '#ff6c7c';
      ctx.fillStyle=`rgba(${100+s.chem[0]*155},${150+s.chem[1]*100},255,${0.3+s.bloom*0.7})`;
      for(let k=0;k<5;k++){
        const ang=(k/5)*Math.PI*2;
        ctx.beginPath();
        ctx.ellipse(s.x+Math.cos(ang)*size*0.3, s.y+Math.sin(ang)*size*0.3, size*0.4, size*0.7, ang,0,Math.PI*2);
        ctx.fill();
      }
      ctx.shadowBlur=0;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,2+s.bloom*2,0,Math.PI*2);ctx.fill();
    } else if(s.future && futureMode){
      ctx.strokeStyle='rgba(255,215,0,0.7)';ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(s.x,s.y,12+Math.sin(Date.now()*0.003)*3,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle='gold';ctx.beginPath();ctx.arc(s.x,s.y,2,0,Math.PI*2);ctx.fill();
    } else {
      ctx.fillStyle=`rgba(255,255,255,${0.2+s.base*0.6})`;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
    }
  });
  requestAnimationFrame(draw);
}
draw();
function doScan(){
  if(scanning) return;scanning=true;
  document.getElementById('scanBtn').innerText='⏳ یادداشتیں چیک ہو رہی ہیں...';
  let found=0,idx=0;
  const interval=setInterval(()=>{
    for(let j=0;j<10;j++){
      if(idx>=stars.length) break;
      const s=stars[idx];
      if(Math.random()<0.045){s.changed=true;s.chem=[Math.random(),Math.random(),Math.random()];found++}
      idx++;
    }
    document.getElementById('c2').innerText=found;
    if(idx>=stars.length){clearInterval(interval);scanning=false;document.getElementById('scanBtn').innerText=`✅ ${found} تبدیلیاں ملیں - پھول کھل گئے`;}
  },18);
}
canvas.addEventListener('click',(e)=>{
  let closest=null,dist=9999;
  stars.forEach(s=>{const d=Math.hypot(s.x-e.clientX,s.y-e.clientY);if(d<dist && d<60){dist=d;closest=s}});
  if(!closest) return;
  document.getElementById('detail').style.display='block';
  document.getElementById('b1').style.width=(closest.chem[0]*100)+'%';
  document.getElementById('b2').style.width=(closest.chem[1]*100)+'%';
  document.getElementById('b3').style.width=(closest.chem[2]*100)+'%';
  if(closest.changed){
    document.getElementById('dTitle').innerText='🔥 CHANGE DETECTED - NEW WORLD';
    document.getElementById('dDesc').innerHTML='پانی +42% بڑھا۔<br><b>نتیجہ:</b> یہاں نیا سیارہ بن رہا ہے۔ یہ صرف کیمیکل سے پتہ چلا، تصویر سے نہیں۔';
  }else{
    document.getElementById('dTitle').innerText='STABLE MEMORY';
    document.getElementById('dDesc').innerHTML='یہ ستارہ 6 مہینے سے ویسا ہی ہے۔ کوئی کیمیکل تبدیلی نہیں۔';
  }
});
document.getElementById('scanBtn').addEventListener('click',doScan);
document.getElementById('futureBtn').addEventListener('click',()=>{
  futureMode=!futureMode;
  if(!futureMode){stars.forEach(s=>s.future=false);document.getElementById('futureBtn').innerText='🔮 مستقبل دکھاؤ (اگلے 6 ماہ)';return;}
  stars.forEach(s=>{if(!s.changed && Math.random()<0.035){s.future=true}});
  document.getElementById('futureBtn').innerText='✨ سنہری دائرے = اگلے 6 ماہ میں تبدیلی';
});
</script>
</body>
</html>
