<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Cipher-X - Original Fixed</title>
<link rel="stylesheet" href="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.css" />
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<style>
body{margin:0;background:#000;color:#fff;font-family:monospace;overflow:hidden}
#aladin-lite-div{width:100vw;height:85vh}
#controls{padding:10px;background:#111;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select{background:#222;color:#0f0;border:1px solid #0f0;padding:8px 12px;cursor:pointer}
#status{color:#0f0;font-size:12px}
</style>
</head>
<body>
<div id="controls">
  <button id="toggleAB">Toggle A/B</button>
  <select id="surveySelect">
    <option value="P/DSS2/color">DSS2 Color</option>
    <option value="P/allWISE/color">WISE IR</option>
    <option value="P/DSS2/red">DSS2 Red</option>
  </select>
  <span id="status">LOADING ORIGINAL SKY...</span>
  <span style="margin-left:auto">FIELD: Orion | 05:35:17 / -05:23 | H2O 3.05um</span>
</div>
<div id="aladin-lite-div"></div>

<script src="https://aladin.cds.unistra.fr/AladinLite/api/v3/latest/aladin.min.js"></script>
<script>
let aladin;
let surveyA = "P/DSS2/color";
let surveyB = "P/allWISE/color";
let isA = true;

A.init.then(() => {
    aladin = A.aladin('#aladin-lite-div', {
        survey: surveyA,
        fov: 0.5,
        target: '05 35 17.3 -05 23 28',
        cooFrame: 'J2000',
        showReticle: true,
        showCooGrid: true
    });
    document.getElementById('status').innerText = "ORIGINAL LIVE: DSS2";
});

document.getElementById('toggleAB').addEventListener('click', () => {
    if(!aladin) return;
    aladin.setImageSurvey(isA ? surveyB : surveyA);
    isA = !isA;
    document.getElementById('status').innerText = isA ? "ORIGINAL LIVE: DSS2" : "ORIGINAL LIVE: WISE IR";
});

document.getElementById('surveySelect').addEventListener('change', (e) => {
    if(!aladin) return;
    aladin.setImageSurvey(e.target.value);
});
</script>
</body>
</html>
